name: Generate Python Client from OpenAPI Spec

on:
  workflow_dispatch:
  push:
    paths:
      - 'OpenAPI_specification/PSI_plantscreen_API.json'
      - '.github/workflows/generate-openapi-client.yml'

jobs:
  generate-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout triggering branch
        run: git checkout ${GITHUB_REF_NAME}

      - name: Generate Python client using OpenAPI Generator
        uses: openapi-generators/openapitools-generator-action@v1
        with:
          generator: python
          openapi-file: OpenAPI_specification/PSI_plantscreen_API.json
          command-args: >-
            -o generated
            -t custom_templates
            --additional-properties=packageName=plantscreen,datetimeFormat=%Y-%m-%dT%H:%M:%S
      

      - name: Copy generated code to /plantscreen
        run: |
          if [ -d generated/plantscreen ]; then
            rm -rf plantscreen/
            mkdir -p plantscreen
            cp -r generated/plantscreen/* plantscreen/
          fi

      - name: Copy generated docs to /docs/docs
        run: |
          if [ -d generated/docs ]; then
            rm -rf docs/docs
            mkdir -p docs/docs
            cp -r generated/docs/* docs/docs/
          fi

      - name: Copy python code to /test
        run: |
          if [ -d build/test ]; then
            rm -rf test/
            mkdir -p test
            cp -r build/test/* test/
          fi

      - name: Copy int.md & README to docs/
        run: |
          cp docs/int.md docs/docs/int.md
          cp README.md docs/README.md

      - name: Copy xml code
        run: |
          mkdir -p plantscreen/xml_models
          cp xml/xml_decoder.py plantscreen/xml_decoder.py
          cp xml/xml_models/* plantscreen/xml_models/
          cp xml/test_xml_decoder.py test/test_xml_decoder.py

      # Run post-generation scripts to fix issues in generated code
      - name: Run fix_field_validator.py
        run: python post_generation/fix_field_validator.py

      - name: Install package in workflow
        run: python -m pip install .

      - name: Run replace_file_api_file_method.py
        run: python post_generation/replace_file_api_file_method.py

      - name: Run generate_complete_api_client.py
        run: python post_generation/generate_complete_api_client.py   

      - name: Run fix_one_of_calls.py
        run: python post_generation/fix_one_of_calls.py 

      - name: Run simplify_returns.py
        run: python post_generation/simplify_returns.py

      - name: update init.py
        run: python post_generation/update_init.py

      # Documentation updates
      - name: Run update_docs.py
        run: python post_generation/update_docs.py

      - name: Run generate_complete_api_client_md.py
        run: python post_generation/generate_docs.py

      - name: Install ruff
        run: pip install ruff

      - name: Format complete_api_client.py with ruff
        run: ruff format plantscreen/complete_api_client.py

      - name: Commit and push generated client
        if: '!cancelled()'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Using GITHUB_TOKEN for authentication"
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs
          git add test
          git add plantscreen
          git commit -m 'chore: regenerate python client from OpenAPI spec' || echo 'No changes to commit'
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git push origin HEAD:${GITHUB_REF_NAME}
