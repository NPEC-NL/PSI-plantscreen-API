name: Generate Python Client from OpenAPI Spec

on:
  workflow_dispatch:
  push:
    paths:
      - 'OpenAPI_specification/PSI_plantscreen_API.json'
      - '.github/workflows/generate-openapi-client.yml'

jobs:
  generate-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Python client using OpenAPI Generator
        uses: openapitools/openapi-generator-cli-action@v1
        with:
          generator: python
          input-spec: OpenAPI_specification/PSI_plantscreen_API.json
          output: generated
          additional-properties: packageName=plantscreen

      - name: Copy generated code to /plantscreen
        run: |
          if [ -d generated/plantscreen ]; then
            rm -rf plantscreen/
            mkdir -p plantscreen
            cp -r generated/plantscreen/* plantscreen/
          fi

      - name: Copy generated docs to /docs/docs
        run: |
          if [ -d generated/docs ]; then
            rm -rf docs/
            mkdir -p docs
            mkdir -p docs/docs
            cp -r generated/docs/* docs/docs/
            cp generated/README.md docs/plantsc_README.md
          fi

      - name: copy README to docs section
        run: |
          cp README.md docs/README.md

      - name: Copy python code to /test
        run: |
          if [ -d build/test ]; then
            rm -rf test/
            mkdir -p test
            cp -r build/test/* test/
          fi

      # Run post-generation scripts to fix issues in generated code
      - name: Run fix_field_validator.py
        run: python post_generation/fix_field_validator.py

      - name: Install package in workflow
        run: pip install .

      - name: Run generate_complete_api_client.py
        run: python post_generation/generate_complete_api_client.py      

      - name: Run fix_one_of_calls.py
        run: python post_generation/fix_one_of_calls.py 

      - name: Run simplify_returns.py
        run: python post_generation/simplify_returns.py 

      - name: Run update_models.py
        run: python post_generation/update_models.py 

      - name: Run update_config_file.py
        run: python post_generation/update_config_file.py 

      - name: Run add_docstrings.py
        run: python post_generation/add_docstrings.py 

      - name: Install ruff
        run: pip install ruff

      - name: Format complete_api_client.py with ruff
        run: ruff format plantscreen/complete_api_client.py

      - name: Commit and push generated client
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Using GITHUB_TOKEN for authentication"
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs
          git add test
          git add plantscreen
          git commit -m 'chore: regenerate python client from OpenAPI spec' || echo 'No changes to commit'
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git push
